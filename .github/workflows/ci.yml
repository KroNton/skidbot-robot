name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  jazzy:
    name: ROS 2 Jazzy
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: jazzy

      - name: Install a C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install dependencies
        run: rosdep install --from-paths . --ignore-src --rosdistro jazzy -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          # copyright, flake8, and pep257 fail on the existing sources.
          # Gate the build plus the linters that already pass (lint_cmake, xmllint).
          colcon test --event-handlers console_direct+ --ctest-args -E "copyright|flake8|pep257"
          colcon test-result --verbose
